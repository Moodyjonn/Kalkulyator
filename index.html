<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maxsus Kalkulator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0d0d14;
  color: #e8e8f0;
  font-family: 'Courier New', Courier, monospace;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  background: #13131e;
  border: 1px solid #2a2a3a;
  border-radius: 20px;
  width: 100%;
  max-width: 420px;
  padding: 36px 28px;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, #00e5a0, #0066ff, #ff6b35);
}

h1 {
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 6px;
  color: #fff;
  letter-spacing: -0.5px;
}

.subtitle {
  text-align: center;
  font-size: 12px;
  color: #555570;
  margin-bottom: 28px;
  letter-spacing: 1px;
}

.badges {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-bottom: 28px;
  flex-wrap: wrap;
}

.badge {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid;
  font-weight: 600;
}

.b1 { border-color: #00e5a055; color: #00e5a0; background: #00e5a010; }
.b2 { border-color: #ff6b3555; color: #ff6b35; background: #ff6b3510; }
.b3 { border-color: #5599ff55; color: #5599ff; background: #5599ff10; }
.b4 { border-color: #ffc80055; color: #ffc800; background: #ffc80010; }

label {
  display: block;
  font-size: 11px;
  color: #555570;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.input-wrap {
  position: relative;
  margin-bottom: 20px;
}

input[type=number] {
  width: 100%;
  background: #1a1a28;
  border: 1px solid #2a2a3a;
  border-radius: 12px;
  color: #fff;
  font-family: 'Courier New', monospace;
  font-size: 30px;
  font-weight: 700;
  padding: 16px 20px;
  outline: none;
  transition: border-color 0.2s;
  -moz-appearance: textfield;
}

input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

input[type=number]:focus { border-color: #00e5a0; }
input[type=number]::placeholder { color: #333345; }
input.error { border-color: #ff4455 !important; }

button.calc {
  width: 100%;
  background: #00e5a0;
  color: #000;
  border: none;
  border-radius: 12px;
  font-family: 'Courier New', monospace;
  font-size: 16px;
  font-weight: 700;
  padding: 16px;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: opacity 0.15s, transform 0.1s;
  margin-bottom: 24px;
}

button.calc:hover { opacity: 0.85; }
button.calc:active { transform: scale(0.98); }

.steps { display: none; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.steps.show { display: flex; }

.step {
  background: #0d0d18;
  border: 1px solid #2a2a3a;
  border-radius: 10px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  animation: up 0.3s ease both;
}

.step:nth-child(1) { animation-delay: 0.04s; }
.step:nth-child(2) { animation-delay: 0.10s; }
.step:nth-child(3) { animation-delay: 0.16s; }
.step:nth-child(4) { animation-delay: 0.22s; }

@keyframes up {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.step-left { display: flex; align-items: center; gap: 10px; }

.num {
  width: 24px; height: 24px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  flex-shrink: 0;
}

.n1 { background: #00e5a015; color: #00e5a0; }
.n2 { background: #ff6b3515; color: #ff6b35; }
.n3 { background: #5599ff15; color: #5599ff; }
.n4 { background: #ffc80015; color: #ffc800; }

.step-desc { color: #555570; font-size: 12px; }
.step-val  { font-weight: 700; color: #fff; font-size: 14px; }

.result {
  display: none;
  background: #0d1a14;
  border: 1px solid #00e5a055;
  border-radius: 14px;
  padding: 24px;
  text-align: center;
  animation: up 0.35s 0.28s ease both;
}

.result.show { display: block; }

.result-label {
  font-size: 11px;
  color: #00e5a0;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.result-num {
  font-size: 48px;
  font-weight: 700;
  color: #00e5a0;
  letter-spacing: -2px;
}

button.reset {
  display: none;
  width: 100%;
  background: transparent;
  border: 1px solid #2a2a3a;
  border-radius: 10px;
  color: #555570;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  padding: 12px;
  cursor: pointer;
  margin-top: 14px;
  transition: border-color 0.2s, color 0.2s;
}

button.reset.show { display: block; }
button.reset:hover { border-color: #555570; color: #e8e8f0; }
</style>
</head>
<body>

<div class="card">
  <h1>Maxsus Kalkulator</h1>
  <p class="subtitle">HISOBLASH FORMULASI</p>

  <div class="badges">
    <span class="badge b1">+3%</span>
    <span class="badge b2">−200</span>
    <span class="badge b3">+30%</span>
    <span class="badge b4">+200</span>
  </div>

  <label for="inp">Boshlang'ich son</label>
  <div class="input-wrap">
    <input type="number" id="inp" placeholder="0" autocomplete="off" />
  </div>

  <button class="calc" onclick="calc()">Hisoblash &rarr;</button>

  <div class="steps" id="steps">
    <div class="step">
      <div class="step-left"><div class="num n1">1</div><span class="step-desc" id="d1"></span></div>
      <span class="step-val" id="v1"></span>
    </div>
    <div class="step">
      <div class="step-left"><div class="num n2">2</div><span class="step-desc" id="d2"></span></div>
      <span class="step-val" id="v2"></span>
    </div>
    <div class="step">
      <div class="step-left"><div class="num n3">3</div><span class="step-desc" id="d3"></span></div>
      <span class="step-val" id="v3"></span>
    </div>
    <div class="step">
      <div class="step-left"><div class="num n4">4</div><span class="step-desc" id="d4"></span></div>
      <span class="step-val" id="v4"></span>
    </div>
  </div>

  <div class="result" id="result">
    <div class="result-label">Yakuniy natija</div>
    <div class="result-num" id="rnum"></div>
  </div>

  <button class="reset" id="resetBtn" onclick="resetAll()">&#8635; Qayta hisoblash</button>
</div>

<script>
function f(n) {
  var r = Math.round(n * 100) / 100;
  return r.toLocaleString('ru-RU');
}

function calc() {
  var inp = document.getElementById('inp');
  var val = inp.value.trim();
  if (val === '' || isNaN(val)) {
    inp.classList.add('error');
    setTimeout(function(){ inp.classList.remove('error'); }, 800);
    return;
  }

  var X = parseFloat(val);
  var s1 = X + X * 0.03;
  var s2 = s1 - 200;
  var s3 = s2 + s2 * 0.30;
  var s4 = s3 + 200;

  document.getElementById('d1').textContent = f(X) + " + 3%";
  document.getElementById('v1').textContent = f(s1);

  document.getElementById('d2').textContent = f(s1) + " − 200";
  document.getElementById('v2').textContent = f(s2);

  document.getElementById('d3').textContent = f(s2) + " + 30%";
  document.getElementById('v3').textContent = f(s3);

  document.getElementById('d4').textContent = f(s3) + " + 200";
  document.getElementById('v4').textContent = f(s4);

  document.getElementById('rnum').textContent = f(s4);

  document.getElementById('steps').classList.add('show');
  document.getElementById('result').classList.add('show');
  document.getElementById('resetBtn').classList.add('show');
}

function resetAll() {
  document.getElementById('inp').value = '';
  document.getElementById('steps').classList.remove('show');
  document.getElementById('result').classList.remove('show');
  document.getElementById('resetBtn').classList.remove('show');
  document.getElementById('inp').focus();
}

document.getElementById('inp').addEventListener('keydown', function(e){
  if (e.key === 'Enter') calc();
});
</script>
</body>
</html>
